name: Python Checks

on:
  push:
  pull_request:

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run unit tests
        run: >
          python3 -m pytest
          tests/test_query_data.py
          tests/test_generate_dataset.py
          tests/test_ingest_data.py
          -v

  cassandra-integration:
    runs-on: ubuntu-latest

    services:
      cassandra:
        image: cassandra:5.0.9
        ports:
          - 9042:9042
        options: >-
          --health-cmd "cqlsh -e 'DESCRIBE KEYSPACES'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 60s

    env:
      CASSANDRA_HOST: 127.0.0.1
      CASSANDRA_PORT: 9042

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: Run Cassandra integration test
        run: python3 -m pytest tests/test_cassandra_integration.py -v
